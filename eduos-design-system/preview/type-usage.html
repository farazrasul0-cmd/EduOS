<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card" style="min-height:258px">
<div style="display:flex;flex-direction:column;gap:16px">
  <div class="label">Number & date formatting</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <div style="background:#F7F8FA;border:1px solid #E5E7EB;border-radius:10px;padding:14px">
      <div class="label" style="margin-bottom:8px">Tabular numerals in tables</div>
      <table style="width:100%;font-size:13px;border-collapse:collapse;font-variant-numeric:tabular-nums">
        <tr><td style="padding:4px 0;color:#0F172A">Aarav Sharma</td><td style="text-align:right;color:#0F172A">₹4,500</td></tr>
        <tr><td style="padding:4px 0;color:#0F172A">Priya Verma</td><td style="text-align:right;color:#0F172A">₹12,000</td></tr>
        <tr><td style="padding:4px 0;color:#0F172A">Rohan Iyer</td><td style="text-align:right;color:#0F172A">₹980</td></tr>
      </table>
    </div>
    <div style="background:#F7F8FA;border:1px solid #E5E7EB;border-radius:10px;padding:14px">
      <div class="label" style="margin-bottom:8px">Dates</div>
      <div style="font-size:13px;color:#0F172A;display:flex;flex-direction:column;gap:6px">
        <div>In tables: <span class="mono">25 May 2026</span></div>
        <div>In headers: <span class="mono">Mon, May 25</span></div>
        <div>Never: <span class="mono" style="text-decoration:line-through;color:#DC2626">05/25/26</span></div>
      </div>
    </div>
  </div>
  <div style="display:flex;align-items:center;gap:14px;font-size:13px">
    <span style="color:#6B7280">Percent:</span><span style="font-weight:600;font-variant-numeric:tabular-nums">92%</span>
    <span style="color:#6B7280">Currency (₹):</span><span style="font-weight:600;font-variant-numeric:tabular-nums">₹4,500</span>
    <span style="color:#6B7280">Currency ($):</span><span style="font-weight:600;font-variant-numeric:tabular-nums">$120</span>
  </div>
</div></div></body></html>
