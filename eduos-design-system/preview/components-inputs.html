<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card" style="min-height:218px">
<div style="display:flex;flex-direction:column;gap:14px">
  <div class="label">Inputs</div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px">
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#334155;font-weight:500">Full name
      <input value="Aarav Sharma" style="height:36px;padding:0 12px;border:1px solid #D1D5DB;border-radius:8px;font:400 14px Inter;color:#0F172A;outline:none">
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#334155;font-weight:500">Email
      <input value="" placeholder="parent@email.com" style="height:36px;padding:0 12px;border:1px solid #D1D5DB;border-radius:8px;font:400 14px Inter;color:#9CA3AF;outline:none">
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#334155;font-weight:500">Focused
      <input value="7-A" style="height:36px;padding:0 12px;border:1px solid #2F6FED;border-radius:8px;font:400 14px Inter;color:#0F172A;outline:none;box-shadow:0 0 0 3px rgba(47,111,237,0.25)">
    </label>
    <label style="display:flex;flex-direction:column;gap:6px;font-size:13px;color:#DC2626;font-weight:500">Error · Fee amount
      <input value="abc" style="height:36px;padding:0 12px;border:1px solid #DC2626;border-radius:8px;font:400 14px Inter;color:#0F172A;outline:none">
      <span style="font-size:12px;color:#DC2626">Enter a number.</span>
    </label>
  </div>
</div></div></body></html>
