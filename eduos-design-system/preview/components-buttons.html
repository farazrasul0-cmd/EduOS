<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card" style="min-height:198px">
<div style="display:flex;flex-direction:column;gap:16px">
  <div class="label">Buttons</div>
  <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
    <button style="background:#2F6FED;color:#fff;border:none;border-radius:8px;padding:0 14px;height:36px;font:600 14px Inter;cursor:pointer">Primary</button>
    <button style="background:#fff;color:#0F172A;border:1px solid #D1D5DB;border-radius:8px;padding:0 14px;height:36px;font:500 14px Inter;cursor:pointer">Secondary</button>
    <button style="background:transparent;color:#2F6FED;border:none;border-radius:8px;padding:0 12px;height:36px;font:500 14px Inter;cursor:pointer">Ghost</button>
    <button style="background:#DC2626;color:#fff;border:none;border-radius:8px;padding:0 14px;height:36px;font:600 14px Inter;cursor:pointer">Destructive</button>
    <button disabled style="background:#2F6FED;color:#fff;border:none;border-radius:8px;padding:0 14px;height:36px;font:600 14px Inter;opacity:.5;cursor:not-allowed">Disabled</button>
  </div>
  <div style="display:flex;align-items:center;gap:10px">
    <button style="background:#2F6FED;color:#fff;border:none;border-radius:8px;padding:0 12px;height:28px;font:600 12px Inter">sm</button>
    <button style="background:#2F6FED;color:#fff;border:none;border-radius:8px;padding:0 14px;height:36px;font:600 14px Inter">md</button>
    <button style="background:#2F6FED;color:#fff;border:none;border-radius:8px;padding:0 18px;height:44px;font:600 15px Inter">lg</button>
    <span class="muted" style="margin-left:12px">heights 28 · 36 · 44</span>
  </div>
</div></div></body></html>
