<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card" style="min-height:198px">
<div style="display:flex;flex-direction:column;gap:14px">
  <div class="label">Status badges</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <span style="display:inline-flex;align-items:center;gap:6px;background:#DCFCE7;color:#16A34A;font:600 12px Inter;padding:4px 10px;border-radius:999px"><span style="width:6px;height:6px;background:#16A34A;border-radius:50%"></span>Present</span><span style="display:inline-flex;align-items:center;gap:6px;background:#FEE2E2;color:#DC2626;font:600 12px Inter;padding:4px 10px;border-radius:999px"><span style="width:6px;height:6px;background:#DC2626;border-radius:50%"></span>Absent</span><span style="display:inline-flex;align-items:center;gap:6px;background:#FEF3C7;color:#D97706;font:600 12px Inter;padding:4px 10px;border-radius:999px"><span style="width:6px;height:6px;background:#D97706;border-radius:50%"></span>Late</span><span style="display:inline-flex;align-items:center;gap:6px;background:#DCFCE7;color:#16A34A;font:600 12px Inter;padding:4px 10px;border-radius:999px"><span style="width:6px;height:6px;background:#16A34A;border-radius:50%"></span>Paid</span><span style="display:inline-flex;align-items:center;gap:6px;background:#FEF3C7;color:#D97706;font:600 12px Inter;padding:4px 10px;border-radius:999px"><span style="width:6px;height:6px;background:#D97706;border-radius:50%"></span>Due</span><span style="display:inline-flex;align-items:center;gap:6px;background:#FEE2E2;color:#DC2626;font:600 12px Inter;padding:4px 10px;border-radius:999px"><span style="width:6px;height:6px;background:#DC2626;border-radius:50%"></span>Overdue</span><span style="display:inline-flex;align-items:center;gap:6px;background:#E5E7EB;color:#475569;font:600 12px Inter;padding:4px 10px;border-radius:999px"><span style="width:6px;height:6px;background:#475569;border-radius:50%"></span>Draft</span><span style="display:inline-flex;align-items:center;gap:6px;background:#EAF1FE;color:#2F6FED;font:600 12px Inter;padding:4px 10px;border-radius:999px"><span style="width:6px;height:6px;background:#2F6FED;border-radius:50%"></span>Published</span>
  </div>
  <div class="label" style="margin-top:4px">Filter chips</div>
  <div style="display:flex;gap:8px;flex-wrap:wrap">
    <span style="background:#2F6FED;color:#fff;font:500 13px Inter;padding:6px 12px;border-radius:8px">Class 7-A</span>
    <span style="background:#F1F3F6;color:#0F172A;font:500 13px Inter;padding:6px 12px;border-radius:8px">All classes</span>
    <span style="background:#F1F3F6;color:#0F172A;font:500 13px Inter;padding:6px 12px;border-radius:8px">This month</span>
    <span style="background:#F1F3F6;color:#0F172A;font:500 13px Inter;padding:6px 12px;border-radius:8px;border:1px dashed #D1D5DB">+ Add filter</span>
  </div>
</div></div></body></html>
