<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card" style="min-height:278px">
<div style="display:flex;flex-direction:column;gap:14px">
  <div class="label">Radius & shadow</div>
  <div style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px">
    
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="width:64px;height:64px;background:#EAF1FE;border:1px solid #D6E4FC;border-radius:4px"></div>
        <div style="font-weight:600;font-size:12px">xs</div>
        <div class="mono" style="font-size:10px;color:#6B7280">4px</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="width:64px;height:64px;background:#EAF1FE;border:1px solid #D6E4FC;border-radius:8px"></div>
        <div style="font-weight:600;font-size:12px">sm</div>
        <div class="mono" style="font-size:10px;color:#6B7280">8px</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="width:64px;height:64px;background:#EAF1FE;border:1px solid #D6E4FC;border-radius:12px"></div>
        <div style="font-weight:600;font-size:12px">md</div>
        <div class="mono" style="font-size:10px;color:#6B7280">12px</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="width:64px;height:64px;background:#EAF1FE;border:1px solid #D6E4FC;border-radius:16px"></div>
        <div style="font-weight:600;font-size:12px">lg</div>
        <div class="mono" style="font-size:10px;color:#6B7280">16px</div>
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px">
        <div style="width:64px;height:64px;background:#EAF1FE;border:1px solid #D6E4FC;border-radius:50%"></div>
        <div style="font-weight:600;font-size:12px">full</div>
        <div class="mono" style="font-size:10px;color:#6B7280">999</div>
      </div>
  </div>
  <div style="display:grid;grid-template-columns:1fr 1fr;gap:14px;margin-top:6px">
    <div style="background:#FFF;border-radius:12px;padding:18px;box-shadow:0 1px 2px rgba(15,23,42,.04),0 1px 3px rgba(15,23,42,.06);border:1px solid #EEF0F3">
      <div style="font-weight:600;font-size:13px;color:#0F172A">shadow-sm</div>
      <div class="mono" style="font-size:11px;color:#6B7280;margin-top:4px">cards at rest</div>
    </div>
    <div style="background:#FFF;border-radius:12px;padding:18px;box-shadow:0 4px 12px rgba(15,23,42,.06),0 12px 32px rgba(15,23,42,.08);border:1px solid #EEF0F3">
      <div style="font-weight:600;font-size:13px;color:#0F172A">shadow-md</div>
      <div class="mono" style="font-size:11px;color:#6B7280;margin-top:4px">popovers, modals</div>
    </div>
  </div>
</div></div></body></html>
