<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_card.css"></head><body><div class="card" style="min-height:198px">
<div style="display:flex;flex-direction:column;gap:12px">
  <div class="label">Semantic</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:10px">
    
      <div style="border:1px solid #E5E7EB;border-radius:10px;overflow:hidden">
        <div style="background:#16A34A;height:36px"></div>
        <div style="background:#DCFCE7;padding:8px 10px"><div style="font-weight:600;font-size:12px;color:#16A34A">Success</div><div class="mono" style="font-size:10px;color:#16A34A;opacity:.85">#16A34A</div></div>
        <div style="padding:6px 10px;font-size:11px;color:#6B7280">Paid · Present</div>
      </div>
      <div style="border:1px solid #E5E7EB;border-radius:10px;overflow:hidden">
        <div style="background:#D97706;height:36px"></div>
        <div style="background:#FEF3C7;padding:8px 10px"><div style="font-weight:600;font-size:12px;color:#D97706">Warning</div><div class="mono" style="font-size:10px;color:#D97706;opacity:.85">#D97706</div></div>
        <div style="padding:6px 10px;font-size:11px;color:#6B7280">Due soon</div>
      </div>
      <div style="border:1px solid #E5E7EB;border-radius:10px;overflow:hidden">
        <div style="background:#DC2626;height:36px"></div>
        <div style="background:#FEE2E2;padding:8px 10px"><div style="font-weight:600;font-size:12px;color:#DC2626">Danger</div><div class="mono" style="font-size:10px;color:#DC2626;opacity:.85">#DC2626</div></div>
        <div style="padding:6px 10px;font-size:11px;color:#6B7280">Absent · Overdue</div>
      </div>
      <div style="border:1px solid #E5E7EB;border-radius:10px;overflow:hidden">
        <div style="background:#0284C7;height:36px"></div>
        <div style="background:#E0F2FE;padding:8px 10px"><div style="font-weight:600;font-size:12px;color:#0284C7">Info</div><div class="mono" style="font-size:10px;color:#0284C7;opacity:.85">#0284C7</div></div>
        <div style="padding:6px 10px;font-size:11px;color:#6B7280">Informational</div>
      </div>
  </div>
</div></div></body></html>
